name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: phrase-bank-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_deploy
          chmod 600 ~/.ssh/tencent_deploy
          ssh-keyscan -H "$TENCENT_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on Tencent Cloud
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
        run: |
          ssh -i ~/.ssh/tencent_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$TENCENT_USER@$TENCENT_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          exec 9>/opt/phrase-bank.operation.lock
          flock 9
          if [ ! -d /opt/phrase-bank/.git ]; then
            git clone https://github.com/justirycn/phrase-bank.git /opt/phrase-bank
          fi
          cd /opt/phrase-bank
          git pull --ff-only origin main
          docker compose build
          docker compose up -d
          for attempt in $(seq 1 24); do
            local_status=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 --resolve phrase.archdemy.com:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://phrase.archdemy.com/ || true)
            public_status=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 --location -o /dev/null -w '%{http_code}' https://phrase.archdemy.com/ || true)
            if [ "$local_status" = 200 ] && [ "$public_status" = 200 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done
          docker compose ps
          docker compose logs --tail=100 phrase-bank caddy
          exit 1
          REMOTE
