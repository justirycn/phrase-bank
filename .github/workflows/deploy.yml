name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact approved commit SHA to deploy
        required: true
        type: string

concurrency:
  group: phrase-bank-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify approved dispatch SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test -n "$APPROVED_SHA"
          test "$GITHUB_SHA" = "$APPROVED_SHA"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_deploy
          chmod 600 ~/.ssh/tencent_deploy
          ssh-keyscan -H "$TENCENT_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on Tencent Cloud
        env:
          DEPLOY_SHA: ${{ github.sha }}
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
        run: |
          case "$DEPLOY_SHA" in
            ""|*[!0-9a-f]*) echo "Invalid deploy SHA"; exit 1 ;;
          esac
          test "${#DEPLOY_SHA}" = 40
          ssh -i ~/.ssh/tencent_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$TENCENT_USER@$TENCENT_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          case "$DEPLOY_SHA" in
            ""|*[!0-9a-f]*) echo "Invalid deploy SHA"; exit 1 ;;
          esac
          test "${#DEPLOY_SHA}" = 40
          exec 9>$HOME/.phrase-bank-operation.lock
          flock 9
          deployment_marker="$HOME/.phrase-bank-deployed-sha"
          deployment_is_healthy() {
            local local_status public_status
            local_status=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 --resolve phrase.archdemy.com:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://phrase.archdemy.com/ || true)
            public_status=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 --location -o /dev/null -w '%{http_code}' https://phrase.archdemy.com/ || true)
            [ "$local_status" = 200 ] && [ "$public_status" = 200 ]
          }
          if [ -L "$deployment_marker" ]; then
            echo "Refusing symbolic-link deployment marker"
            exit 1
          fi
          if [ -f "$deployment_marker" ] && test "$(cat "$deployment_marker")" = "$DEPLOY_SHA"; then
            if deployment_is_healthy; then
              echo "Exact deployment is already healthy"
              exit 0
            fi
            echo "Exact deployment marker exists but health failed; rebuilding"
          fi
          if [ -e /opt/phrase-bank ] && [ ! -d /opt/phrase-bank/.git ]; then
            echo "Refusing non-repository deploy directory"
            exit 1
          fi
          if [ ! -d /opt/phrase-bank/.git ]; then
            git init /opt/phrase-bank
            git -C /opt/phrase-bank remote add origin https://github.com/justirycn/phrase-bank.git
          fi
          cd /opt/phrase-bank
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin main
          git cat-file -e "$DEPLOY_SHA^{commit}"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          docker compose build
          docker compose up -d
          for attempt in $(seq 1 24); do
            if deployment_is_healthy; then
              deployment_marker_pending="$(mktemp "$HOME/.phrase-bank-deployed-sha.XXXXXX")"
              trap 'rm -f -- "${deployment_marker_pending:-}"' EXIT
              printf '%s\n' "$DEPLOY_SHA" > "$deployment_marker_pending"
              chmod 600 "$deployment_marker_pending"
              mv -f -- "$deployment_marker_pending" "$deployment_marker"
              deployment_marker_pending=
              trap - EXIT
              exit 0
            fi
            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done
          docker compose ps
          docker compose logs --tail=100 phrase-bank caddy
          exit 1
          REMOTE
