name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact approved commit SHA to deploy
        required: true
        type: string

concurrency:
  group: phrase-bank-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify approved dispatch SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          test -n "$APPROVED_SHA"
          test "$GITHUB_SHA" = "$APPROVED_SHA"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TENCENT_SSH_KEY" > ~/.ssh/tencent_deploy
          chmod 600 ~/.ssh/tencent_deploy
          ssh-keyscan -H "$TENCENT_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on Tencent Cloud
        env:
          DEPLOY_SHA: ${{ github.sha }}
          TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
          TENCENT_USER: ${{ secrets.TENCENT_USER }}
        run: |
          case "$DEPLOY_SHA" in
            ""|*[!0-9a-f]*) echo "Invalid deploy SHA"; exit 1 ;;
          esac
          test "${#DEPLOY_SHA}" = 40
          ssh -i ~/.ssh/tencent_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$TENCENT_USER@$TENCENT_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -se" < .github/scripts/deploy-exact-sha.sh
