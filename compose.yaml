services:
  phrase-bank:
    build:
      context: .
      dockerfile: Dockerfile
    image: phrase-bank:latest
    container_name: phrase-bank
    restart: unless-stopped
    env_file:
      # Reuse the project's existing private Qwen configuration; runtime overrides win.
      - path: /etc/phrase-bank/qwen-content.env
        required: false
      - path: /etc/phrase-bank/speech.env
        required: false
    expose:
      - "3000"
    environment:
      - PHRASE_DB_PATH=/app/data/phrase-bank.sqlite
      - APP_GIT_SHA=${DEPLOY_SHA:-development}
      # The app is reachable only behind Caddy; preserve HTTPS for Origin checks.
      - VINEXT_TRUSTED_HOSTS=phrase.archdemy.com,43.153.204.17
    volumes:
      - phrase_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(v=>{if(!v.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2.10.2-alpine
    container_name: phrase-bank-proxy
    restart: unless-stopped
    depends_on:
      phrase-bank:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  phrase_data:
  caddy_data:
  caddy_config:
